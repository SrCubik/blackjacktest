<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="blackjack.css">
</head>
<body>
    <div class="flex"><input type="number" id="money" value="1" min="1"></div>
    <div class="flex">
        
        <button onclick="start()" id="start" class="buttons">bet</button>
    </div>
    <div class="flex" id="dealerResult"></div>
    <div class="flex" id="dealerImage"></div>
    
    <div class="flex" id="cardImage"></div>
    <div class="flex" id="cardResult"></div>
    <div class="flex" id="winResult"></div>
    <div class="flex">
        <button onclick="hit()" id="hit" class="buttons" disabled>hit</button>
        <button onclick="stand()" id="stand" class="buttons" disabled>stand</button>
    </div>
     <div class="flex"><div id="amountMoney"></div></div>
    
<script src="blackjack.js"></script>
</body>

</html>
